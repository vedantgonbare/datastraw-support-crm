<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support CRM — Tickets</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-semibold text-gray-800">Support CRM</h1>
    <a href="/static/create.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
      + New Ticket
    </a>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- Status dashboard strip (stand-out feature) -->
    <div id="status-counts" class="grid grid-cols-3 gap-4 mb-6">
      <!-- filled by JS -->
    </div>

    <!-- Search + Filter bar -->
    <div class="flex gap-4 mb-6">
      <input
        id="search-input"
        type="text"
        placeholder="Search by name, email, ID, or description..."
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <select id="status-filter" class="border border-gray-300 rounded-lg px-4 py-2">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <!-- Ticket table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-gray-100 text-gray-600 text-sm">
          <tr>
            <th class="px-4 py-3">Ticket ID</th>
            <th class="px-4 py-3">Customer</th>
            <th class="px-4 py-3">Subject</th>
            <th class="px-4 py-3">Priority</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3">Date</th>
          </tr>
        </thead>
        <tbody id="tickets-tbody">
          <!-- filled by JS -->
        </tbody>
      </table>
      <div id="empty-state" class="hidden text-center py-12 text-gray-400">
        No tickets found.
      </div>
    </div>

  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/index.js"></script>
</body>
</html>
