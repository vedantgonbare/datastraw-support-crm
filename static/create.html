<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Ticket — Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
    <a href="/static/index.html" class="text-xl font-semibold text-gray-800">Support CRM</a>
    <a href="/static/index.html" class="text-gray-500 hover:text-gray-800 transition">← Back to tickets</a>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-10">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Create New Ticket</h2>

    <form id="create-form" class="bg-white rounded-lg shadow p-6 space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name</label>
        <input type="text" id="customer_name" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Customer Email</label>
        <input type="email" id="customer_email" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
        <input type="text" id="subject" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="description" rows="4" required
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
        <select id="priority"
          class="w-full border border-gray-300 rounded-lg px-4 py-2">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
          <option value="Urgent">Urgent</option>
        </select>
      </div>

      <div id="form-error" class="hidden text-red-600 text-sm"></div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 transition font-medium">
        Create Ticket
      </button>

    </form>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/create.js"></script>
</body>
</html>
